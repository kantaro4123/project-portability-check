name: Project Portability Check
description: Scan a repository for cross-platform portability hazards without executing project code.
author: kantaro4123
branding:
  icon: check-circle
  color: blue
inputs:
  path:
    description: Project path to analyze, relative to the GitHub workspace.
    required: false
    default: .
  strict:
    description: Fail the action when warnings are found as well as errors.
    required: false
    default: "true"
  format:
    description: "Output format: text, json, or sarif."
    required: false
    default: text
  target:
    description: "Optional comma-separated target platforms: linux, macos, windows."
    required: false
    default: ""
  baseline:
    description: Previous JSON report to use as a baseline, relative to the analyzed project root.
    required: false
    default: ""
  output:
    description: Optional report file path, relative to the GitHub workspace.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build portability checker
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        go build -o "$RUNNER_TEMP/project-portability-check-action" ./cmd/project-portability-check

    - name: Analyze project portability
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        args=()
        case "$INPUT_FORMAT" in
          text) ;;
          json) args+=(--json) ;;
          sarif) args+=(--sarif) ;;
          *) echo "error: format must be text, json, or sarif" >&2; exit 2 ;;
        esac
        if [ "$INPUT_STRICT" = "true" ]; then
          args+=(--strict)
        fi
        if [ -n "$INPUT_TARGET" ]; then
          args+=(--target "$INPUT_TARGET")
        fi
        if [ -n "$INPUT_BASELINE" ]; then
          args+=(--baseline "$INPUT_BASELINE")
        fi

        project="$GITHUB_WORKSPACE/$INPUT_PATH"
        if [ -z "$INPUT_OUTPUT" ]; then
          "$RUNNER_TEMP/project-portability-check-action" "${args[@]}" "$project"
          exit $?
        fi

        output="$GITHUB_WORKSPACE/$INPUT_OUTPUT"
        mkdir -p "$(dirname "$output")"
        set +e
        "$RUNNER_TEMP/project-portability-check-action" "${args[@]}" "$project" | tee "$output"
        status=${PIPESTATUS[0]}
        set -e
        exit "$status"
